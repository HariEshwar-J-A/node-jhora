name: Epic
description: Propose an epic-sized backlog item.
body:
  - type: markdown
    attributes:
      value: |
        One epic per issue. Start the title with the backlog ID, for example `[E1] Monorepo, toolchain and CI`.
  - type: input
    id: backlog-id
    attributes:
      label: Backlog ID
      description: Epic ID.
      placeholder: E1
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this epic exists and what is true today.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true when this epic is done.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Checklist the epic must satisfy.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: files-likely-touched
    attributes:
      label: Files likely touched
      description: Paths or packages this epic is expected to change.
      placeholder: |
        - packages/core/
    validations:
      required: true
  - type: textarea
    id: test-requirements
    attributes:
      label: Test requirements
      description: Tests, goldens, or checks required before the epic is complete.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Backlog IDs or issues that block this epic. Write "None" if nothing blocks it.
      placeholder: None
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: XS=1, S=2, M=3, L=5, XL=8 points.
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true
