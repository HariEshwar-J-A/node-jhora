name: Task
description: Propose one implementation task (one pull request).
body:
    - type: markdown
      attributes:
          value: |
              One task per issue and one pull request per task. Start the title with the backlog ID, for example `[E1-S5-T2] PR template, issue templates and CODEOWNERS`.
    - type: input
      id: backlog-id
      attributes:
          label: Backlog ID
          description: Task ID.
          placeholder: E1-S5-T2
      validations:
          required: true
    - type: textarea
      id: context
      attributes:
          label: Context
          description: Why this task exists and what is true today.
      validations:
          required: true
    - type: textarea
      id: goal
      attributes:
          label: Goal
          description: What is true when this task is done.
      validations:
          required: true
    - type: textarea
      id: acceptance-criteria
      attributes:
          label: Acceptance criteria
          description: Checklist copied into the pull request.
          placeholder: |
              - [ ] ...
      validations:
          required: true
    - type: textarea
      id: files-likely-touched
      attributes:
          label: Files likely touched
          description: Paths this task is expected to change. Call out anything outside this list in the pull request.
          placeholder: |
              - .github/pull_request_template.md
              - CONTRIBUTING.md
      validations:
          required: true
    - type: textarea
      id: test-requirements
      attributes:
          label: Test requirements
          description: Unit, property, golden, or other checks this task must add or keep green.
      validations:
          required: true
    - type: textarea
      id: dependencies
      attributes:
          label: Dependencies
          description: Backlog IDs or issues that block this task. Write "None" if nothing blocks it.
          placeholder: None
      validations:
          required: true
    - type: dropdown
      id: size
      attributes:
          label: Size
          description: XS=1, S=2, M=3, L=5, XL=8 points.
          options:
              - XS
              - S
              - M
              - L
              - XL
      validations:
          required: true
