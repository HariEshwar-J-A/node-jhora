name: Pack check

# Gates what each publishable package would put in its npm tarball. Runs only when FULL CI
# is enabled (repository variable FULL_CI=true, PR label `full-ci`, or CI workflow_dispatch
# with full_ci). Release still runs check:pack before publish.

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    pack:
        if: vars.FULL_CI == 'true' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.23.4'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm build

            - name: Check package tarballs
              run: pnpm check:pack

            - name: JSR dry-run (types and publish layout)
              run: pnpm jsr:dry-run
