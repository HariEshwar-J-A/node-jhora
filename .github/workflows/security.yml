name: Security

# pnpm audit runs on every PR. Runtime licence scan matches release gates but runs only
# when FULL CI is enabled (repository variable FULL_CI=true or PR label `full-ci`).

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    audit:
        name: pnpm audit (high+)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.23.4'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Fail on high or critical advisories
              run: pnpm audit --audit-level=high

    license-check:
        if: vars.FULL_CI == 'true' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        name: Runtime licence check (no AGPL/GPL)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.23.4'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check:licenses
