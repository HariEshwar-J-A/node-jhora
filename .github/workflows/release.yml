name: Release

# Standard Changesets flow on upstream main only. Opens/updates "Version Packages"
# when changesets are pending; publishes to npm (OIDC trusted publishing) when
# the version PR merges and no changesets remain. JSR publish runs after npm.
# See docs/guides/releasing.md.

on:
    push:
        branches: [main]

concurrency:
    group: release-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        if: github.repository == 'HariEshwar-J-A/node-jhora'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        outputs:
            published: ${{ steps.changesets.outputs.published }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '22.23.4'
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Node 22 images ship npm 10.x; npm Trusted Publishing (OIDC) needs npm ≥ 11.5.1.
            # pnpm changeset publish delegates to npm publish for registry upload.
            - name: Install npm CLI for OIDC trusted publishing
              run: npm install -g npm@11.5.1

            - name: Release gates
              run: |
                  pnpm build
                  pnpm lint
                  pnpm typecheck
                  pnpm api:check
                  pnpm test
                  pnpm check:pack
                  pnpm check:licenses
                  pnpm check:copyright
                  pnpm check:license-sync
                  pnpm check:jsr-versions

            - name: Create Release Pull Request or publish to npm
              id: changesets
              uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1.4.10
              with:
                  version: pnpm version-packages
                  publish: pnpm changeset publish
                  commit: 'chore(release): version packages'
                  title: Version Packages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'

    jsr:
        needs: release
        if: >-
            github.repository == 'HariEshwar-J-A/node-jhora' &&
            needs.release.outputs.published == 'true'
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '22.23.4'
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Publish JSR packages (OIDC)
              run: node scripts/jsr-publish-all.mjs
