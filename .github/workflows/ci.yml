# Lean CI on every PR/push (Ubuntu, Node 22): install, format, lint, typecheck, build,
# unit tests, and the @node-jhora/web smoke test. Jobs run in parallel after checkout.
#
# Extended checks (Windows/Node 20 matrix, golden, docs, api-report, benches, clean-room,
# link/tools validators) run only when FULL CI is enabled via:
#   - workflow_dispatch input `full_ci: true` on this workflow
#   - repository variable `FULL_CI=true`
#   - pull request label `full-ci`
#
# Pack, runtime-smoke (Bun/Deno), and Security licence audit workflows use the same
# FULL_CI gating (see their headers). Release workflow gates are unchanged.
#
# Branch protection: point required checks at the lean job names (format, lint, typecheck,
# build, unit, web). Retired matrix job names from the old pipeline should be removed.

name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            full_ci:
                description: Run full matrix and extended checks
                type: boolean
                default: false

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '22.23.4'
    TURBO_CACHE_PREFIX: turbo-ubuntu-latest-node22.23.4

jobs:
    format:
        name: format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ env.TURBO_CACHE_PREFIX }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ env.TURBO_CACHE_PREFIX }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check

    lint:
        name: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ env.TURBO_CACHE_PREFIX }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ env.TURBO_CACHE_PREFIX }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint

    typecheck:
        name: typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ env.TURBO_CACHE_PREFIX }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ env.TURBO_CACHE_PREFIX }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm run typecheck

    build:
        name: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ env.TURBO_CACHE_PREFIX }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ env.TURBO_CACHE_PREFIX }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

    unit:
        name: unit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ env.TURBO_CACHE_PREFIX }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ env.TURBO_CACHE_PREFIX }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm test

    web:
        name: web
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec turbo run build --filter=./packages/*
            - run: pnpm --filter @node-jhora/web build
            - run: pnpm --filter @node-jhora/web exec playwright install --with-deps chromium
            - run: pnpm --filter @node-jhora/web test:e2e
              env:
                  CI: 'true'
                  SKIP_WEB_GLOBAL_BUILD: '1'

    full-matrix:
        name: full-matrix (${{ matrix.os }} node${{ matrix.node }})
        if: ${{ vars.FULL_CI == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_ci) || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      node: '20'
                    - os: windows-latest
                      node: '20'
                    - os: windows-latest
                      node: '22'
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: turbo-${{ matrix.os }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      turbo-${{ matrix.os }}-node${{ matrix.node }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check
            - run: pnpm lint
            - run: pnpm run typecheck
            - run: pnpm run build
            - run: pnpm test

    golden:
        name: golden
        if: ${{ vars.FULL_CI == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_ci) || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ env.TURBO_CACHE_PREFIX }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ env.TURBO_CACHE_PREFIX }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run test:golden
            - run: pnpm run check:clean-room
            - run: pnpm run check:links
            - run: pnpm run test:tools
            - run: pnpm run validate-github-templates

    docs:
        name: docs
        if: ${{ vars.FULL_CI == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_ci) || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ env.TURBO_CACHE_PREFIX }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ env.TURBO_CACHE_PREFIX }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run docs:build

    api-report:
        name: api-report
        if: ${{ vars.FULL_CI == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_ci) || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ env.TURBO_CACHE_PREFIX }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ env.TURBO_CACHE_PREFIX }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec turbo run build --force --filter=./packages/*
            - run: pnpm run api:check

    bench:
        name: bench
        if: ${{ vars.FULL_CI == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_ci) || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ env.TURBO_CACHE_PREFIX }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ env.TURBO_CACHE_PREFIX }}-
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run bench
            - run: pnpm run bench:check
