# apps/ is not checked in yet. The glob is here so a later app is a workspace
# package without another install-config change.
packages:
    - 'packages/*'
    - 'apps/*'

# pnpm 12 fails `pnpm install` with ERR_PNPM_IGNORED_BUILDS until every
# dependency that has a lifecycle script is approved or denied here. This is
# not a hoist: node_modules stays isolated (no .npmrc).
#
# unrs-resolver — dependency of jest-resolve. Its postinstall (napi-postinstall)
# selects the prebuilt native binding the resolver loads.
# @parcel/watcher — dependency of jest-haste-map. The install script compiles
# from source only when npm_config_build_from_source=true; otherwise it exits
# without doing work and the prebuilt optional package is what loads.
# esbuild — dependency of tsx (horizons:refresh). Its postinstall checks that
# the prebuilt platform binary from the optional @esbuild/* package runs.
allowBuilds:
    esbuild: true
    '@parcel/watcher': true
    unrs-resolver: true

# light-my-request 6.8 depends on cookie 2, which is ESM-only. Jest 30 on
# Node 22 loads node_modules through require() and refuses that file
# (fastify's inject() then fails every API test). 6.6.0 depends on cookie
# ^1, the pair the previous npm lockfile tested, and it still satisfies
# fastify's light-my-request range (^6.0.0). Do not override zod: api stays
# All workspace packages pin zod 4.6.7 (patched for GHSA-mrhx-c7xc-m3w5).
# Why cookie 2 breaks Jest: cookie 2.0.0 is ESM-only
#   https://github.com/jshttp/cookie/releases/tag/v2.0.0
# and Jest loads CommonJS node_modules through its own require(), not Node's
#   https://jestjs.io/docs/ecmascript-modules
# Drop this override once Jest can load cookie 2 (or fastify pins cookie 1).
overrides:
    light-my-request: 6.6.0
